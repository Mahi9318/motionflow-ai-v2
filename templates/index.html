<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotionFlow AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        .card {
            background: #15151f;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        button {
            width: 100%;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #333;
            background: #0d0d14;
            color: white;
            margin-bottom: 18px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #6c4cff;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5738e8;
        }

        #status {
            text-align: center;
            color: #aaa;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            color: #666;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MotionFlow AI</h1>

    <div class="subtitle">
        Kling Motion Control Style AI Video Generator
    </div>

    <div class="card">

        <label>Image</label>
        <input type="file" id="image" accept="image/*">

        <label>Motion Video</label>
        <input type="file" id="video" accept="video/*">

        <label>Prompt</label>

        <textarea
            id="prompt"
            placeholder="Describe your video..."
        ></textarea>

        <button onclick="generateVideo()">
            Generate Video
        </button>

        <div id="status"></div>

    </div>

    <div class="card">

        <h2>MotionFlow AI</h2>

        <p>
            Upload an image and motion video, then generate
            your AI motion-control video.
        </p>

    </div>

    <div class="footer">
        MotionFlow AI © 2026
    </div>

</div>

<script>

async function generateVideo() {

    const status = document.getElementById("status");

    status.innerText = "Checking server...";

    try {

        const response = await fetch("/health");

        const data = await response.json();

        if (data.ok) {

            status.innerText =
                "Server is working. AI generation endpoint needs to be connected.";

        } else {

            status.innerText = "Server error.";

        }

    } catch (error) {

        status.innerText =
            "Connection error: " + error.message;

    }

}

</script>

</body>
</html>
